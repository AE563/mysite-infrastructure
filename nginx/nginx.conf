events {}

http {
    # Without this every static file goes out as text/plain and browsers drop the CSS.
    # Proxied apps were unaffected — Django sets its own Content-Type.
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's internal DNS — resolves container names at request time, not startup
    resolver 127.0.0.11 valid=10s;

    # Rate limiting: 5 requests/min per IP on login pages
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # HTTP: redirect to HTTPS
    server {
        listen 80;
        server_name groceries.ae563.ru;

        # Renewals must stay reachable over plain HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS: groceries
    server {
        listen 443 ssl;
        server_name groceries.ae563.ru;

        ssl_certificate /etc/letsencrypt/live/groceries.ae563.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/groceries.ae563.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /login/ {
            limit_req zone=login burst=3 nodelay;

            proxy_pass http://groceries_web:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://groceries_web:8000;

            # WebSocket support (Django Channels)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # trading — HTTP only until ai_gw2_tp is deployed
    server {
        listen 80;
        server_name trading.ae563.ru;

        location / {
            set $trading_upstream http://trading_web:8000;
            proxy_pass $trading_upstream;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # trainer — english_trainer. HTTP only serves ACME until the cert is issued;
    # the HTTPS block lives in english_trainer/deploy/nginx-trainer-https.conf
    server {
        listen 80;
        server_name trainer.ae563.ru;

        # Renewals must stay reachable over plain HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # sunplaystudio.com — static landing (SunDoku), no upstream container
    server {
        listen 80;
        server_name sunplaystudio.com www.sunplaystudio.com;

        # Renewals must stay reachable over plain HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://sunplaystudio.com$request_uri;
        }
    }

    # www → apex, so the site has one canonical address
    server {
        listen 443 ssl;
        server_name www.sunplaystudio.com;

        ssl_certificate /etc/letsencrypt/live/sunplaystudio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sunplaystudio.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 301 https://sunplaystudio.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name sunplaystudio.com;

        ssl_certificate /etc/letsencrypt/live/sunplaystudio.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sunplaystudio.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/sunplaystudio;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
