networks:
  shared_net:
    name: shared_net

services:
  nginx:
    image: nginx:alpine
    container_name: shared_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Let's Encrypt: certs live here, ACME challenges are written here by certbot
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Static landing for sunplaystudio.com — sparse checkout of frudoku (site/ only)
      - ${SUNPLAYSTUDIO_ROOT:-./sites/sunplaystudio}:/var/www/sunplaystudio:ro
    networks:
      - shared_net
    restart: unless-stopped

  # On-demand only: docker compose run --rm certbot ...
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - tools

  db:
    image: postgres:15-alpine
    container_name: shared_db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shared_redis
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
